services:
  zapohteh_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}
    ports:
      - "8014:8014"
    environment:
      - DB_PATH=${DB_PATH:-/app/data/app.db}
      - STATIC_PATH=web/dist
      - CONTENT_DIR=/app/data
    networks:
      - app-network
    volumes:
      - .:/app
      - sqlite_data:/app/data

networks:
  app-network:
    driver: bridge
volumes:
  sqlite_data:
    driver: local
