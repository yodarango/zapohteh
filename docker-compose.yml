services:
  zapohteh_app:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-zapohteh}
    ports:
      - "8014:8014"
    env_file:
      - .env
    environment:
      - DB_PATH=${DB_PATH:-/app/data/app.db}
      - STATIC_PATH=web/dist
    networks:
      - app-network
    volumes:
      - .:/app
      - sqlite_data:/app/data

networks:
  app-network:
    driver: bridge
volumes:
  sqlite_data:
    driver: local
