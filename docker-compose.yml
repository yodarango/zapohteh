services:
  zapohteh_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}
    ports:
      - "8014:8014"
    environment:
      - DB_PATH=${DB_PATH:-/app/data/app.db}
      - STATIC_PATH=web/dist
      - CONTENT_DIR=/app/data
      - JOB_UPLOAD_DIR=/app/job-uploads
      - VIRTUAL_CLEANUP_BACKUP_DIR=/app/cleanup-backups
      - TANJREEN_API_KEY=${TANJREEN_API_KEY:-}
      - TANJREEN_API_URL=${TANJREEN_API_URL:-https://tanjreen.shrood.app}
    networks:
      - app-network
    volumes:
      - .:/app
      - ${HOST_DATA_PATH:-./data}:/app/data
      - ${HOST_JOB_UPLOAD_PATH:-./job-uploads}:/app/job-uploads
      - ${HOST_CLEANUP_BACKUP_PATH:-./.virtual-cleanup-backups}:/app/cleanup-backups

networks:
  app-network:
    driver: bridge
